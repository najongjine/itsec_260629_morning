<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>JavaScript 비트코인 가격 그래프</title>

  <!-- 그래프 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background-color: #f4f6f8;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px;
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .title {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }

    .description {
      margin-bottom: 25px;
      color: #666;
      text-align: center;
    }

    .price-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .current-price {
      font-size: 32px;
      font-weight: bold;
    }

    .change-rate {
      font-size: 18px;
      font-weight: bold;
    }

    .up {
      color: #e53935;
    }

    .down {
      color: #1976d2;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 450px;
    }

    .button-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh-button {
      background-color: #f7931a;
    }

    .refresh-button:hover {
      background-color: #d97d0d;
    }

    .auto-button {
      background-color: #333;
    }

    .auto-button:hover {
      background-color: #111;
    }

    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    .status {
      min-height: 24px;
      margin-top: 15px;
      color: #666;
      text-align: center;
    }

    .update-time {
      margin-top: 8px;
      color: #888;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
      }

      .price-box {
        flex-direction: column;
        gap: 5px;
      }

      .current-price {
        font-size: 24px;
      }

      .chart-container {
        height: 350px;
      }
    }
  </style>
</head>

<body>
  <!-- HTML에는 빈 공간만 존재 -->
  <div id="app"></div>

  <script>
    const API_URL =
      "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart" +
      "?vs_currency=krw&days=1";

    /*
      애플리케이션 상태

      React에서는 보통 useState로 관리하지만,
      순수 JavaScript에서는 직접 변수를 만들고
      화면도 직접 수정해야 한다.
    */
    const state = {
      currentPrice: 0,
      changeRate: 0,
      prices: [],
      loading: false,
      errorMessage: "",
      lastUpdated: null,
      autoRefresh: true
    };

    let bitcoinChart = null;
    let timerId = null;

    /*
      화면 요소를 보관할 객체

      나중에 가격이나 상태를 변경하려면
      생성한 DOM 요소를 따로 기억해야 한다.
    */
    const elements = {
      app: null,
      container: null,
      title: null,
      description: null,
      priceBox: null,
      currentPrice: null,
      changeRate: null,
      chartContainer: null,
      canvas: null,
      buttonArea: null,
      refreshButton: null,
      autoButton: null,
      status: null,
      updateTime: null
    };

    /*
      DOM 요소를 쉽게 생성하기 위한 함수
    */
    function createElement(tagName, className, text) {
      const element = document.createElement(tagName);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    /*
      전체 HTML 구조를 JavaScript로 생성
    */
    function createApp() {
      elements.app = document.getElementById("app");

      // 가장 바깥쪽 박스
      elements.container =
        createElement("main", "container");

      // 제목
      elements.title =
        createElement(
          "h1",
          "title",
          "₿ 비트코인 가격"
        );

      // 설명
      elements.description =
        createElement(
          "p",
          "description",
          "최근 24시간 비트코인 원화 가격"
        );

      // 가격 표시 영역
      elements.priceBox =
        createElement("section", "price-box");

      elements.currentPrice =
        createElement(
          "span",
          "current-price",
          "가격을 불러오는 중..."
        );

      elements.changeRate =
        createElement(
          "span",
          "change-rate",
          ""
        );

      elements.priceBox.append(
        elements.currentPrice,
        elements.changeRate
      );

      // 그래프 영역
      elements.chartContainer =
        createElement("section", "chart-container");

      elements.canvas =
        createElement("canvas");

      elements.canvas.id = "bitcoinChart";

      elements.chartContainer.append(
        elements.canvas
      );

      // 버튼 영역
      elements.buttonArea =
        createElement("div", "button-area");

      elements.refreshButton =
        createElement(
          "button",
          "refresh-button",
          "가격 새로고침"
        );

      elements.autoButton =
        createElement(
          "button",
          "auto-button",
          "자동 갱신 중지"
        );

      elements.buttonArea.append(
        elements.refreshButton,
        elements.autoButton
      );

      // 상태 메시지
      elements.status =
        createElement("div", "status");

      // 마지막 갱신 시간
      elements.updateTime =
        createElement("div", "update-time");

      // container에 자식 요소 추가
      elements.container.append(
        elements.title,
        elements.description,
        elements.priceBox,
        elements.chartContainer,
        elements.buttonArea,
        elements.status,
        elements.updateTime
      );

      // 최종적으로 app에 추가
      elements.app.append(
        elements.container
      );

      /*
        이벤트도 JavaScript에서 직접 연결
      */
      elements.refreshButton.addEventListener(
        "click",
        loadBitcoinPrice
      );

      elements.autoButton.addEventListener(
        "click",
        toggleAutoRefresh
      );
    }

    /*
      원화 형식으로 변경
    */
    function formatKRW(price) {
      return new Intl.NumberFormat("ko-KR", {
        style: "currency",
        currency: "KRW",
        maximumFractionDigits: 0
      }).format(price);
    }

    /*
      시간만 표시
    */
    function formatTime(timestamp) {
      const date = new Date(timestamp);

      const hour =
        String(date.getHours()).padStart(2, "0");

      const minute =
        String(date.getMinutes()).padStart(2, "0");

      return `${hour}:${minute}`;
    }

    /*
      state의 값을 화면에 반영하는 함수

      React에서는 state가 바뀌면 화면이 자동으로 다시 렌더링되지만,
      순수 JavaScript에서는 직접 DOM을 하나하나 수정해야 한다.
    */
    function render() {
      // 로딩 중
      if (state.loading) {
        elements.refreshButton.disabled = true;

        elements.status.textContent =
          "비트코인 가격을 가져오는 중입니다.";
      } else {
        elements.refreshButton.disabled = false;
      }

      // 오류 발생
      if (state.errorMessage) {
        elements.currentPrice.textContent =
          "가격 조회 실패";

        elements.changeRate.textContent = "";

        elements.status.textContent =
          state.errorMessage;

        return;
      }

      // 가격이 존재하는 경우
      if (state.currentPrice > 0) {
        elements.currentPrice.textContent =
          formatKRW(state.currentPrice);

        const arrow =
          state.changeRate >= 0 ? "▲" : "▼";

        elements.changeRate.textContent =
          `${arrow} ${Math.abs(state.changeRate).toFixed(2)}%`;

        /*
          기존 클래스를 직접 제거하고
          새로운 클래스를 직접 추가한다.
        */
        elements.changeRate.classList.remove(
          "up",
          "down"
        );

        if (state.changeRate >= 0) {
          elements.changeRate.classList.add("up");
        } else {
          elements.changeRate.classList.add("down");
        }

        elements.status.textContent =
          "가격을 정상적으로 불러왔습니다.";
      }

      // 마지막 갱신 시간
      if (state.lastUpdated) {
        elements.updateTime.textContent =
          "마지막 갱신: " +
          state.lastUpdated.toLocaleString("ko-KR");
      }

      // 자동 갱신 버튼
      elements.autoButton.textContent =
        state.autoRefresh
          ? "자동 갱신 중지"
          : "자동 갱신 시작";
    }

    /*
      그래프 생성
    */
    function drawChart() {
      const labels = state.prices.map(item => {
        return formatTime(item[0]);
      });

      const priceValues = state.prices.map(item => {
        return item[1];
      });

      if (bitcoinChart !== null) {
        bitcoinChart.destroy();
      }

      bitcoinChart = new Chart(
        elements.canvas,
        {
          type: "line",

          data: {
            labels: labels,

            datasets: [
              {
                label: "비트코인 가격",
                data: priceValues,
                borderColor: "#f7931a",
                backgroundColor:
                  "rgba(247, 147, 26, 0.15)",
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 5,
                fill: true,
                tension: 0.2
              }
            ]
          },

          options: {
            responsive: true,
            maintainAspectRatio: false,

            interaction: {
              mode: "index",
              intersect: false
            },

            plugins: {
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return formatKRW(context.raw);
                  }
                }
              }
            },

            scales: {
              x: {
                ticks: {
                  maxTicksLimit: 12
                },

                title: {
                  display: true,
                  text: "시간"
                }
              },

              y: {
                ticks: {
                  callback: function(value) {
                    return (
                      Math.round(value / 10000) +
                      "만 원"
                    );
                  }
                },

                title: {
                  display: true,
                  text: "비트코인 가격"
                }
              }
            }
          }
        }
      );
    }

    /*
      API에서 비트코인 데이터 가져오기
    */
    async function loadBitcoinPrice() {
      state.loading = true;
      state.errorMessage = "";

      // 상태가 바뀌었으므로 직접 화면 갱신
      render();

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(
            `API 요청 실패: ${response.status}`
          );
        }

        const data = await response.json();

        if (
          !data.prices ||
          data.prices.length === 0
        ) {
          throw new Error(
            "가격 데이터가 없습니다."
          );
        }

        const prices = data.prices;

        const firstPrice =
          prices[0][1];

        const currentPrice =
          prices[prices.length - 1][1];

        const changeRate =
          (
            (currentPrice - firstPrice) /
            firstPrice
          ) * 100;

        /*
          상태 변경
        */
        state.prices = prices;
        state.currentPrice = currentPrice;
        state.changeRate = changeRate;
        state.lastUpdated = new Date();
      } catch (error) {
        console.error(error);

        state.errorMessage =
          "가격을 가져오지 못했습니다: " +
          error.message;
      } finally {
        state.loading = false;

        /*
          상태 변경 후 화면도 직접 갱신
        */
        render();

        if (state.prices.length > 0) {
          drawChart();
        }
      }
    }

    /*
      자동 갱신 시작 또는 중지
    */
    function toggleAutoRefresh() {
      state.autoRefresh =
        !state.autoRefresh;

      if (state.autoRefresh) {
        startAutoRefresh();
      } else {
        stopAutoRefresh();
      }

      render();
    }

    /*
      1분마다 갱신
    */
    function startAutoRefresh() {
      stopAutoRefresh();

      timerId = setInterval(
        loadBitcoinPrice,
        60 * 1000
      );
    }

    /*
      자동 갱신 중지
    */
    function stopAutoRefresh() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    /*
      프로그램 시작
    */
    createApp();
    render();
    loadBitcoinPrice();
    startAutoRefresh();
  </script>
</body>
</html>
